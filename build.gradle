plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.0' apply false
    id 'co.uzzu.dotenv.gradle' version "4.0.0"
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$rootProject.minecraft_version-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings "net.fabricmc:yarn:$rootProject.yarn_mappings:v2"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

publishMods {
    changelog = file("$rootDir/CHANGELOG.md").text
    type = STABLE

    def withSources = true

    def cfOptions = curseforgeOptions {
        accessToken = env.fetchOrNull("CURSEFORGE_TOKEN") ?: System.getProperty("CURSEFORGE_TOKEN")
        projectId = "1110531"
        changelogType = "markdown"
        minecraftVersionRange {
            start = project.minecraft_version
            end = project.minecraft_version
        }
        clientRequired = true
        serverRequired = true
    }

    def mrOptions = modrinthOptions {
        accessToken = env.fetchOrNull("MODRINTH_TOKEN") ?: System.getProperty("MODRINTH_TOKEN")
        projectId = "EjqfdsbN"
        minecraftVersionRange {
            start = project.minecraft_version
            end = project.minecraft_version
        }
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        if (withSources) {
            additionalFiles.from(project(":fabric").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        displayName = "[Fabric] " + "The Afterdark v" + project.version
    }

    curseforge("curseforgeForge") {
        from cfOptions
        file project(":forge")
        if (withSources) {
            additionalFiles.from(project(":forge").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("forge")
        modLoaders.add("neoforge")
        displayName = "[Forge] " + "The Afterdark v" + project.version
    }


    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        if (withSources) {
            additionalFiles.from(project(":fabric").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        displayName = "[Fabric] " + "The Afterdark v" + project.version
    }

    modrinth("modrinthForge") {
        from mrOptions
        file project(":forge")
        if (withSources) {
            additionalFiles.from(project(":forge").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("forge")
        modLoaders.add("neoforge")
        displayName = "[Forge] " + "The Afterdark v" + project.version
    }

}